<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ระบบลงทะเบียนสมาชิกใหม่ - Manual Testing Lab</title>
</head>
<body>
    <h2>ฟอร์มลงทะเบียนสมาชิกใหม่ (Registration Form)</h2>
    <form action="#" method="POST">
        <!-- ช่องที่ 1: ชื่อ-นามสกุล -->
        <label for="fullname">ชื่อ-นามสกุล:</label><br>
        <input type="text" id="fullname" name="fullname" required><br><br>

        <!-- ช่องที่ 2: อายุ (สำหรับเทส Boundary values) -->
        <label for="age">อายุ (ปี):</label><br>
        <input type="number" id="age" name="age" min="18" max="60" required><br><br>

        <!-- ช่องที่ 3: อีเมล -->
        <label for="email">อีเมล:</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <!-- ช่องที่ 4: ประเภทสมาชิก (Dropdown) -->
        <label for="member_type">ประเภทสมาชิก:</label><br>
        <select id="member_type" name="member_type">
            <option value="general">บุคคลทั่วไป</option>
            <option value="student">นักเรียน/นักศึกษา</option>
            <option value="vip">สมาชิก VIP</option>
        </select><br><br>

        <!-- ปุ่มกดบันทึก -->
        <button type="submit">ลงทะเบียน</button>
    </form>
</body>
</html>
